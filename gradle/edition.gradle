// Shared by the carpet editions (carpet/, carpet-1.21/): the root mod's sources, recompiled into
// com.example.importsim.carpet next to the edition's own Edition class (and, where the Minecraft
// version needs it, its own VersionScreen). Each edition sets ext.ownSources to the files it
// supplies itself before applying this.

// The root version, with this edition's own Minecraft version in the "+mc" suffix.
version = rootProject.version.toString().replaceFirst(/\+mc.*/, "+mc${project.minecraft_version}")
group = project.maven_group

base {
    archivesName = project.edition_archive
}

def shared = layout.buildDirectory.dir('generated/shared/java')

def copyShared = tasks.register('copySharedSources', Copy) {
    from(rootProject.file('src/main/java/com/example/importsim')) {
        exclude project.ext.ownSources
    }
    into(shared.map { it.dir('com/example/importsim/carpet') })
    filter { String line -> line.replace('com.example.importsim', 'com.example.importsim.carpet') }
}

sourceSets.main.java.srcDir(copyShared)

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation include("com.github.junrar:junrar:${project.junrar_version}")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: project.version
    }
    from(rootProject.file('src/main/resources/assets/import-simulators/icon.png')) {
        into 'assets/import-carpet-maps'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}
