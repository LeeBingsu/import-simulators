plugins {
    id 'fabric-loom' version '1.17.20'
}

// Patch number = commits on the branch, so each update ships a higher version with no manual edit.
// Falls back to 0 when git is unavailable (e.g. building from a source archive).
def buildNumber = "0"
try {
    def git = providers.exec {
        commandLine("git", "rev-list", "--count", "HEAD")
        workingDir(rootDir)
        ignoreExitValue = true
    }
    if (git.result.get().exitValue == 0) {
        def count = git.standardOutput.asText.get().trim()
        if (count ==~ /\d+/) {
            buildNumber = count
        }
    }
} catch (Exception ignored) {
    logger.lifecycle("git unavailable; using build number 0")
}

version = "${project.mod_version}.${buildNumber}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom injects the Fabric + Mojang repositories automatically.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Bundled into the mod jar: maps may be published as .rar, which the JDK cannot read.
    implementation include("com.github.junrar:junrar:${project.junrar_version}")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}
